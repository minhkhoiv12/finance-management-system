spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/financial}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:password}

server.port=${PORT:8080}
server.servlet.context-path=/api/v1.0
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT phải là chuỗi bí mật ít nhất 32 ký tự. Đặt JWT_SECRET riêng cho từng môi trường.
jwt.secret=${JWT_SECRET:financial-new-development-secret-change-before-production-2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:36000000}
money.manager.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.activation.url= https://financial-system-api-3zs5.onrender.com
spring.profiles.active=prod

